<!DOCTYPE html>
<html lang="vi" class="theme-light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu – Public</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Public">
<meta name="theme-color" content="#F1F0FA">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/css/global.css?v=20260808">
<link rel="stylesheet" href="/css/liquid-glass.css?v=20260808">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 16px; }
.auth-box { width: 100%; max-width: 400px; animation: fadeIn 0.4s ease; }
.back-btn { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; transition: var(--transition); }
.back-btn:hover { color: var(--text-primary); }
.auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px 24px; text-align: center; }
.icon-big { font-size: 48px; margin-bottom: 12px; }
.auth-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
.auth-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.6; }
.form { display: flex; flex-direction: column; gap: 14px; }
.success-state { display: none; text-align: center; }
.success-state.show { display: block; }
.form-state.hide { display: none; }
</style>
</head>
<body>
<div class="auth-box">
  <a href="login.html" class="back-btn" style="display:inline-flex;align-items:center;gap:6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Quay lại đăng nhập</a>
  <div class="auth-card">
    <div class="form-state" id="formState">
      <div class="icon-big"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style=""><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
      <div class="auth-title">Quên mật khẩu?</div>
      <div class="auth-desc">Nhập email của bạn và chúng tôi sẽ gửi link đặt lại mật khẩu</div>
      <div class="form">
        <div class="input-group">
          <div class="input-wrap">
            <span class="input-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
            <input class="input has-icon" id="email" type="email" placeholder="email@example.com">
          </div>
        </div>
        <button class="btn btn-primary" id="submitBtn" style="width:100%;padding:13px" onclick="submit()">Gửi link đặt lại</button>
      </div>
    </div>
    <div class="success-state" id="successState">
      <div class="icon-big"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style=""><path d="M4 20V10a4 4 0 0 1 4-4h1a4 4 0 0 1 4 4v10"/><path d="M4 20h13a3 3 0 0 0 3-3v-4"/><circle cx="18.5" cy="10.5" r="2.5"/></svg></div>
      <div class="auth-title">Email đã được gửi!</div>
      <div class="auth-desc">Kiểm tra hộp thư của bạn và nhấn vào link trong email để đặt lại mật khẩu.<br><br><small>Không thấy email? Kiểm tra thư mục Spam.</small></div>
      <a href="login.html" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:6px;margin-top:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Về đăng nhập</a>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="/js/api.js?v=20260808"></script>
<script>
async function submit() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');
  if (!email) return Toast.error('Vui lòng nhập email');

  loadingBtn(btn, true);
  const res = await API.post('/auth/forgot-password', { email });
  loadingBtn(btn, false);

  if (res?.success) {
    document.getElementById('formState').classList.add('hide');
    document.getElementById('successState').classList.add('show');
  } else {
    Toast.error(res?.message || 'Có lỗi xảy ra');
  }
}
document.getElementById('email').addEventListener('keydown', e => e.key === 'Enter' && submit());
</script>
</body>
</html>
